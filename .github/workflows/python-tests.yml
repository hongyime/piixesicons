name: Python Tests

on:
  pull_request:
    branches: [main]
    paths:
      - scrape_images.py
      - tests/**
      - requirements.txt
      - .github/workflows/python-tests.yml
  push:
    branches: [main]
    paths:
      - scrape_images.py
      - tests/**
      - requirements.txt
      - .github/workflows/python-tests.yml

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Offline download regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            /scrape_images.py
            /requirements.txt
            /tests/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q scrape_images.py tests
      - name: Test disposable outputs with network disabled
        run: python -m unittest discover -s tests -v
